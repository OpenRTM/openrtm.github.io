name: Build & Deploy Jekyll to Pages

'on':
  push:
    branches: [ main ]   # Deploy from the default branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install deps
        run: bundle install --jobs 4 --retry 3

      - name: Stage Bootstrap and Bootswatch 4.6.2 Sass
        run: bash scripts/stage_bootstrap_sass.sh

      - name: Build
        run: bundle exec jekyll build --trace

      - name: Audit generated HTML for CSP inline scripts
        run: python3 scripts/audit_csp_inline.py _site --max-examples 100

      - name: Generate aspect-ratio-preserving favicon
        run: ruby scripts/generate_favicon.rb

      - name: Fetch pinned vendor assets for same-origin delivery
        run: bash scripts/fetch_vendor_assets.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
