{%- assign share_title = "Share on" -%}
{%- assign linkedin = site.data.blog.social_share[0] -%}
{%- assign twitter = site.data.blog.social_share[1] -%}

<h4>{{ share_title }}</h4>
<a href="https://twitter.com/intent/tweet?{% if twitter.username %}via={{ twitter.username | url_encode }}&{% endif %}text={{ page.title | url_encode }}%20{{ page.url | absolute_url | url_encode }}" class="btn btn-social btn-twitter" data-share-popup="true" title="{{ share_title }} Twitter"><i class="fab fa-fw fa-twitter" aria-hidden="true"></i><span> Twitter</span></a>
<a href="https://www.linkedin.com/shareArticle?mini=true&url={{ page.url | absolute_url | url_encode }}" class="btn btn-social btn-linkedin" data-share-popup="true" title="{{ share_title }} LinkedIn"><i class="fab fa-fw fa-linkedin" aria-hidden="true"></i><span> LinkedIn</span></a>
