
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenRTM-aist</title>

  <script>
    const language = navigator.language || "en";
    const target = language.toLowerCase().startsWith("ja")
      ? "/ja/"
      : "/en/";

    window.location.replace(target);
  </script>
</head>
<body>
  <h1>OpenRTM-aist</h1>
  <p>Select your language:</p>
  <p>
    <a href="/ja/">日本語</a> |
    <a href="/en/">English</a>
  </p>
</body>
</html>
